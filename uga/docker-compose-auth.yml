version: '3'


# 定义锚点
x-java-opts: &java_opts_base >-
  -Duser.timezone=GMT+03
  -Dspring.profiles.active=pro
  -Dspring.cloud.nacos.username=nacos
  -Dspring.cloud.nacos.password=Ci@nacos@2023
  -Dspring.cloud.nacos.discovery.server-addr=10.140.53.6:8848
  -Dspring.cloud.nacos.config.server-addr=10.140.53.6:8848
  -Xms1024m
  -Xmx2048m

services:
  ci-dp-sys-auth:
    image: auth-ci:latest
    container_name: auth
    restart: always
    environment:
      JAVA_OPTS: *java_opts_base
    ports:
      - "3001:3001"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/wg/java-project/uga/ci-dp/auth/logs:/logs/ci-dp-sys-auth
    network_mode: "host"