version: '3'

services:
  # --- 主库配置 ---
  mysql-master:
    image: mysql:8.0.45
    container_name: mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: CI@yanfa@2023
    ports:
      - "3306:3306"
    volumes:
      # 挂载配置文件
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
      # 数据持久化
      - ./data:/opt/data/mysql-8.0.45/data
    command: --default-authentication-plugin=mysql_native_password